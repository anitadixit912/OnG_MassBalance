applications:
  - name: mass-balance-orchestrator-agent
    memory: 256M
    disk_quota: 768M
    buildpacks:
      - python_buildpack
    no-route: false
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      PYTHONPATH: .
      AI_MODEL: anthropic--claude-3.5-sonnet
    services:
      - proj-vector-destination-service
      - proj-vector-connectivity-service
