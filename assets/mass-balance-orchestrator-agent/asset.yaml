apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: mass-balance-orchestrator-agent
  version: 1.0.0

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: mass-balance-orchestrator-agent
      kind: a2a
      ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.mass-balance-orchestrator-agent:v1

requires:
  # SAP BTP Destination Service — provides OGS_S4 → OGS_650 connectivity
  - name: destination
    kind: platform-service
    service: destination
    plan: lite

  # Sub-Agents — A2A services coordinated by this orchestrator
  - name: data-collection-agent
    kind: a2a
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.data-collection-agent:v1
  - name: validation-anomaly-agent
    kind: a2a
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.validation-anomaly-agent:v1
  - name: calculation-reconciliation-agent
    kind: a2a
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.calculation-reconciliation-agent:v1
  - name: exception-management-agent
    kind: a2a
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.exception-management-agent:v1
  - name: report-generation-agent
    kind: a2a
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.report-generation-agent:v1

  # MCP Servers — SAP OData APIs via OGS_S4 destination
  - name: sap-s4-material-stock-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-material-stock-mcp-server:v1
  - name: sap-s4-material-document-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-material-document-mcp-server:v1
  - name: sap-s4-physical-inventory-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-physical-inventory-mcp-server:v1
  - name: sap-s4-stock-transport-order-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-stock-transport-order-mcp-server:v1
  - name: sap-s4-proc-order-confirmation-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-proc-order-confirmation-mcp-server:v1
