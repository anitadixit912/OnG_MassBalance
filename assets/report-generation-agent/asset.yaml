apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: report-generation-agent
  version: 1.0.0

agentCard:
  name: Report Generation Agent
  version: 1.0.0
  description: Builds structured exception reports (Exception ID, Period, Plant/Tank/Material, Variance MT/%, Severity, Root Cause, Supporting Docs, Recommendation, Status) and Executive KPI dashboard summaries.

container:
  port: 5000

models:
  - executableId: aws-bedrock
    name: anthropic--claude-4.5-sonnet

provides:
  apis:
    - name: report-generation-agent
      kind: a2a
      ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.report-generation-agent:v1

probes:
  startup:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
