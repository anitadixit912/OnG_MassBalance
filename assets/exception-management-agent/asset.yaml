apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: exception-management-agent
  version: 1.0.0

agentCard:
  name: Exception Management Agent
  version: 1.0.0
  description: Applies configurable tolerance matrix. Classifies variance severity (INFO/ADVISORY/WARNING/CRITICAL) and root cause (MC/TX/MD/TF/PL/SY). Investigates via MSEG/MKPF drill-down. Builds evidence packages.

container:
  port: 5000

models:
  - executableId: aws-bedrock
    name: anthropic--claude-4.5-sonnet

provides:
  apis:
    - name: exception-management-agent
      kind: a2a
      ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.exception-management-agent:v1

requires:
  - name: sap-s4-material-document-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-material-document-mcp-server:v1
  - name: sap-s4-physical-inventory-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-physical-inventory-mcp-server:v1
  - name: sap-s4-stock-transport-order-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:mass-balance-reconciliation-a37df.sap-s4-stock-transport-order-mcp-server:v1

probes:
  startup:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 12
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 5
