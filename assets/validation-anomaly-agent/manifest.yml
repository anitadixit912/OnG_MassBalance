applications:
  - name: validation-anomaly-agent
    memory: 160M
    disk_quota: 768M
    buildpacks:
      - python_buildpack
    no-route: false
    health-check-type: http
    health-check-http-endpoint: /.well-known/agent.json
    env:
      PYTHONPATH: .
      AICORE_DEPLOYMENT_ID: dbc88cbc32f1206e
      AICORE_DESTINATION_NAME: aicore
      AICORE_RESOURCE_GROUP: default
      LOG_LEVEL: INFO
      AGENT_PUBLIC_URL: https://validation-anomaly-agent.cfapps.us10.hana.ondemand.com
    services:
      - proj-vector-destination-service
      - proj-vector-connectivity-service
