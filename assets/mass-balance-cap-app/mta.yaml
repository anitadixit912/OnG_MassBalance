{
    "_schema-version": "3.1",
    "ID": "mass-balance-cap-app",
    "version": "1.0.0",
    "description": "Mass Balance Reconciliation — CAP app with inline AI agent",

    "modules": [

        {
            "name": "mass-balance-cap-app-srv",
            "type": "nodejs",
            "path": ".",
            "parameters": {
                "memory"    : "256M",
                "disk-quota": "768M",
                "buildpacks": ["nodejs_buildpack"],
                "routes"    : [
                    { "route": "mass-balance-cap-app-srv.cfapps.us10.hana.ondemand.com" }
                ]
            },
            "properties": {
                "NODE_ENV"              : "production",
                "CDS_CONFIG"            : "{\"requires\":{\"auth\":{\"kind\":\"dummy\",\"users\":{\"*\":{\"roles\":[\"MassBalance.Engineer\",\"MassBalance.Manager\",\"MassBalance.Compliance\"]}}}}}",
                "AICORE_DEPLOYMENT_ID"  : "d20b9095bde7c0ef",
                "AICORE_RESOURCE_GROUP" : "default",
                "AICORE_MODEL"          : "anthropic--claude-4.5-sonnet"
            },
            "build-parameters": {
                "builder"     : "npm",
                "build-result": ".",
                "ignore"      : ["node_modules/", ".env", "*.mtar", "mta_archives/", ".mass-balance-cap-app_mta_build_tmp/"]
            },
            "requires": [
                { "name": "proj-vector-destination-service" },
                { "name": "proj-vector-connectivity-service" }
            ]
        }

    ],

    "resources": [
        {
            "name": "proj-vector-destination-service",
            "type": "org.cloudfoundry.existing-service"
        },
        {
            "name": "proj-vector-connectivity-service",
            "type": "org.cloudfoundry.existing-service"
        }
    ]
}

