{
    "_schema-version": "3.1",
    "ID": "mass-balance-cap-app",
    "version": "1.0.0",
    "description": "Mass Balance Reconciliation — CAP Fiori UI + all agents (single MTA)",

    "modules": [

        {
            "name": "mass-balance-cap-app-srv",
            "type": "nodejs",
            "path": ".",
            "parameters": {
                "memory"    : "256M",
                "disk-quota": "512M",
                "buildpacks": ["nodejs_buildpack"],
                "routes"    : [
                    { "route": "mass-balance-cap-app-srv.cfapps.us10.hana.ondemand.com" }
                ]
            },
            "properties": {
                "NODE_ENV"              : "production",
                "AICORE_DEPLOYMENT_ID"  : "d20b9095bde7c0ef",
                "AICORE_RESOURCE_GROUP" : "default",
                "AICORE_MODEL"          : "anthropic--claude-4.5-sonnet"
            },
            "build-parameters": {
                "builder"     : "npm",
                "build-result": ".",
                "ignore"      : ["node_modules/", ".env"]
            },
            "provides": [
                { "name": "mass-balance-cap-app-srv-api",
                  "properties": { "srv-url": "${default-url}" }
                }
            ],
            "requires": [
                { "name": "mass-balance-cap-app-xsuaa" },
                { "name": "proj-vector-destination-service" }
            ]
        },

        {
            "name": "mass-balance-cap-app-approuter",
            "type": "approuter.nodejs",
            "path": "app/mass-balance-ui",
            "parameters": {
                "memory"    : "64M",
                "disk-quota": "256M",
                "routes"    : [
                    { "route": "mass-balance-cap-app.cfapps.us10.hana.ondemand.com" }
                ]
            },
            "requires": [
                { "name": "mass-balance-cap-app-xsuaa" },
                { "name": "mass-balance-cap-app-srv-api",
                  "group": "destinations",
                  "properties": {
                      "name"            : "cap-srv",
                      "url"             : "~{srv-url}",
                      "forwardAuthToken": true
                  }
                }
            ]
        },

    ],

    "resources": [
        {
            "name": "mass-balance-cap-app-xsuaa",
            "type": "org.cloudfoundry.managed-service",
            "parameters": {
                "service"     : "xsuaa",
                "service-plan": "application",
                "path"        : "./xs-security.json",
                "config"      : {
                    "xsappname"  : "mass-balance-cap-app",
                    "tenant-mode": "dedicated"
                }
            }
        },
        {
            "name": "proj-vector-destination-service",
            "type": "org.cloudfoundry.existing-service"
        },
        {
            "name": "proj-vector-connectivity-service",
            "type": "org.cloudfoundry.existing-service"
        }
    ]
}
