<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mass Balance Reconciliation</title>
    <script id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m,sap.ui.core,sap.ui.layout,sap.tnt"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="allow"
        data-sap-ui-preload="async">
    </script>
    <script>
        sap.ui.getCore().attachInit(function () {
            sap.ui.require([
                "sap/m/Shell",
                "sap/m/App",
                "sap/m/Page",
                "sap/m/Bar",
                "sap/m/Title",
                "sap/m/GenericTile",
                "sap/m/TileContent",
                "sap/m/ImageContent",
                "sap/ui/layout/cssgrid/CSSGrid"
            ], function (Shell, App, Page, Bar, Title, GenericTile, TileContent, ImageContent, CSSGrid) {

                var tiles = [
                    { title: "KPI Dashboard",       subtitle: "Runs · Variances · KPIs",         icon: "sap-icon://manager-insight", url: "/$fiori-preview/MassBalanceService/ReconciliationRuns" },
                    { title: "Exception Report",    subtitle: "All variance exceptions",          icon: "sap-icon://alert",            url: "/$fiori-preview/MassBalanceService/Exceptions" },
                    { title: "Approval Workflow",   subtitle: "Pending corrections",             icon: "sap-icon://approvals",        url: "/$fiori-preview/MassBalanceService/Approvals" },
                    { title: "Audit Trail",         subtitle: "Immutable event log",             icon: "sap-icon://document-text",    url: "/$fiori-preview/MassBalanceService/AuditLogs" },
                    { title: "Tolerance Config",    subtitle: "Thresholds per material group",   icon: "sap-icon://settings",         url: "/$fiori-preview/MassBalanceService/ToleranceConfigs" },
                    { title: "Domain Status",       subtitle: "TANK · MAT · MOV · PHYS · BOOK", icon: "sap-icon://database",         url: "/$fiori-preview/MassBalanceService/DomainStatuses" },
                    { title: "AI Assistant",        subtitle: "Chat with the agent",             icon: "sap-icon://ai",               url: "/$fiori-preview/MassBalanceService/ReconciliationRuns" }
                ];

                var aTiles = tiles.map(function (t) {
                    return new GenericTile({
                        header: t.title,
                        subheader: t.subtitle,
                        press: function () { window.open(t.url, "_blank"); },
                        tileContent: new TileContent({
                            content: new ImageContent({ src: t.icon })
                        })
                    });
                });

                var oPage = new Page({
                    showHeader: true,
                    customHeader: new Bar({
                        contentMiddle: new Title({ text: "Mass Balance Reconciliation", level: "H2" })
                    }),
                    content: aTiles
                });

                new Shell({
                    app: new App({ pages: oPage })
                }).placeAt("content");
            });
        });
    </script>
</head>
<body class="sapUiBody" id="content"></body>
</html>
