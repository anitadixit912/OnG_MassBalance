<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mass Balance Reconciliation</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root {
    --sidebar-w: 220px;
    --hdr-h: 54px;
    --sap-blue: #0070f2;
    --sap-blue-dk: #0040b0;
    --sap-teal: #0a6ed1;
    --sap-green: #107e3e;
    --sap-orange: #e9730c;
    --sap-red: #bb0000;
    --sap-grey: #6a6d70;
    --bg: #f5f6f7;
    --surface: #ffffff;
    --border: #d9dadc;
    --text: #1d2d3e;
    --text-light: #6a6d70;
    --badge-open: #e8f0fe;
    --badge-done: #e6f4ea;
    --badge-warn: #fff3e0;
    --badge-err: #fce8e6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: '72',Arial,sans-serif; background: var(--bg); color: var(--text); }

  /* ── HEADER ───────────────────────────────────────────────────────── */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--hdr-h);
    background: #1d2d3e; color: #fff;
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,.28);
  }
  header .logo { font-size: 18px; font-weight: 700; letter-spacing: .5px; flex: 1; text-align: center; color: #f0c040; }
  header .sub  { font-size: 12px; opacity: .8; }
  header .user { font-size: 13px; background: rgba(255,255,255,.2); border-radius: 16px; padding: 4px 12px; }

  /* ── SIDEBAR ──────────────────────────────────────────────────────── */
  nav {
    position: fixed; top: var(--hdr-h); left: 0; bottom: 0;
    width: var(--sidebar-w); background: #1d2d3e; border-right: 1px solid #0d1b2a;
    overflow-y: auto; z-index: 90;
  }
  nav .nav-section { padding: 14px 16px 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; color: #f0c040; letter-spacing: .8px; }
  nav a {
    display: flex; align-items: center; gap: 10px; padding: 10px 18px;
    text-decoration: none; color: #c8d8e8; font-size: 13.5px; transition: background .15s;
    cursor: pointer; border-left: 3px solid transparent;
  }
  nav a:hover { background: #263d54; }
  nav a.active { background: #0d3a6e; border-left-color: #4da3ff; color: #ffffff; font-weight: 600; }
  nav a .ico { width: 18px; text-align: center; font-size: 15px; }

  /* ── MAIN CONTENT ─────────────────────────────────────────────────── */
  main {
    margin-top: var(--hdr-h); margin-left: var(--sidebar-w);
    padding: 24px 28px; min-height: calc(100vh - var(--hdr-h));
  }

  /* ── SCREEN TITLE ─────────────────────────────────────────────────── */
  .screen-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .screen-sub   { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }

  /* ── KPI CARDS ────────────────────────────────────────────────────── */
  .kpi-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .kpi-card {
    background: var(--surface); border: 1px solid #a0aab4; border-radius: 8px;
    padding: 18px 24px; min-width: 170px; flex: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  .kpi-card .kpi-label { font-size: 11px; text-transform: uppercase; color: var(--text-light); letter-spacing: .5px; margin-bottom: 8px; }
  .kpi-card .kpi-value { font-size: 28px; font-weight: 700; color: var(--sap-blue); }
  .kpi-card .kpi-delta { font-size: 12px; color: var(--text-light); margin-top: 4px; }
  .kpi-card.green .kpi-value { color: var(--sap-green); }
  .kpi-card.orange .kpi-value { color: var(--sap-orange); }
  .kpi-card.red .kpi-value   { color: var(--sap-red); }

  /* ── TABLE ────────────────────────────────────────────────────────── */
  .toolbar {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .toolbar input[type=text] {
    border: 1px solid var(--border); border-radius: 4px; padding: 7px 12px;
    font-size: 13px; width: 240px; color: var(--text);
  }
  .toolbar input[type=text]:focus { outline: none; border-color: var(--sap-blue); }
  .toolbar select {
    border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px;
    font-size: 13px; color: var(--text); background: white;
  }
  .toolbar .spacer { flex: 1; }
  .btn {
    padding: 7px 16px; border-radius: 4px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid; transition: .15s;
  }
  .btn-primary { background: var(--sap-blue); color: #fff; border-color: var(--sap-blue); }
  .btn-primary:hover { background: var(--sap-blue-dk); }
  .btn-ghost { background: #fff; color: var(--sap-blue); border-color: var(--sap-blue); }
  .btn-ghost:hover { background: #eaf2fb; }
  .btn-danger { background: var(--sap-red); color: #fff; border-color: var(--sap-red); }
  .btn-success { background: var(--sap-green); color: #fff; border-color: var(--sap-green); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  .table-wrap { background: var(--surface); border: 1px solid #a0aab4; border-radius: 8px; overflow: auto; box-shadow: 0 1px 4px rgba(0,0,0,.10); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th { background: #f0f2f5; padding: 10px 14px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; border-bottom: 2px solid #a0aab4; border-right: 1px solid #c8cdd2; white-space: nowrap; }
  thead th:last-child { border-right: none; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid #d0d5da; border-right: 1px solid #e4e7ea; vertical-align: middle; }
  tbody td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }
  tbody tr.selected { background: #e8f2ff; }
  tbody tr.domain-row-highlight { background: #fff8d6; outline: 2px solid #f0c040; }
  .empty-row td { text-align: center; padding: 40px; color: var(--text-light); font-style: italic; }

  /* ── BADGES ───────────────────────────────────────────────────────── */
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: .4px; white-space: nowrap;
  }
  .badge-red    { background: var(--badge-err);  color: var(--sap-red); }
  .badge-orange { background: var(--badge-warn); color: var(--sap-orange); }
  .badge-blue   { background: var(--badge-open); color: var(--sap-teal); }
  .badge-green  { background: var(--badge-done); color: var(--sap-green); }
  .badge-grey   { background: #f0f2f5; color: var(--sap-grey); }

  /* ── DETAIL PANEL ─────────────────────────────────────────────────── */
  .detail-panel {
    background: var(--surface); border: 1px solid #a0aab4; border-radius: 8px;
    padding: 24px; margin-top: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.10);
  }
  .detail-panel h3 { font-size: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .detail-field .lbl { font-size: 11px; text-transform: uppercase; color: var(--text-light); letter-spacing: .4px; margin-bottom: 4px; }
  .detail-field .val { font-size: 14px; font-weight: 500; }
  .detail-field .val.long { font-size: 13px; font-weight: 400; line-height: 1.5; }

  /* ── FORM (modal) ─────────────────────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 200; display: flex; align-items: center; justify-content: center;
  }
  .overlay.hidden { display: none; }
  .modal {
    background: #fff; border-radius: 10px; padding: 28px 32px;
    min-width: 420px; max-width: 560px; width: 90%;
    box-shadow: 0 8px 32px rgba(0,0,0,.2);
  }
  .modal h3 { font-size: 17px; margin-bottom: 20px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text-light); text-transform: uppercase; letter-spacing: .4px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 4px;
    padding: 8px 12px; font-size: 13px; color: var(--text);
  }
  .form-row textarea { resize: vertical; height: 80px; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { outline: none; border-color: var(--sap-blue); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── AI CHAT ──────────────────────────────────────────────────────── */
  .chat-outer { display: flex; flex-direction: column; height: calc(100vh - var(--hdr-h) - 60px); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .chat-hdr { background: #003366; color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .chat-hdr h2 { font-size: 14px; font-weight: 600; flex: 1; }
  .chat-hdr .badge { font-size: 11px; background: #0070d2; padding: 2px 8px; border-radius: 12px; }
  .chat-samples { background: #eef4fb; border-bottom: 1px solid #c8ddf5; padding: 8px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
  .chat-samples label { font-size: 11px; color: #555; white-space: nowrap; }
  .chat-sample-btn { padding: 4px 12px; background: #fff; border: 1px solid #0070d2; border-radius: 16px; color: #0070d2; font-size: 11px; cursor: pointer; white-space: nowrap; }
  .chat-sample-btn:hover { background: #0070d2; color: #fff; }
  .chat-clear-btn { padding: 4px 12px; background: #fff; border: 1px solid #aaa; border-radius: 16px; color: #888; font-size: 11px; cursor: pointer; margin-left: auto; }
  .chat-clear-btn:hover { background: #f5f5f5; color: #555; }
  .chat-msgs { flex: 1; overflow-y: auto; padding: 14px 18px; background: #f9fafb; display: flex; flex-direction: column; gap: 12px; }
  .cmsg { max-width: 82%; padding: 11px 15px; border-radius: 8px; font-size: 13.5px; line-height: 1.6; word-break: break-word; }
  .cmsg.user    { align-self: flex-end; background: #0070d2; color: #fff; white-space: pre-wrap; }
  .cmsg.agent   { align-self: flex-start; background: #fff; border: 1px solid #ddd; color: #222; }
  .cmsg.error   { align-self: flex-start; background: #fff0f0; border: 1px solid #fcc; color: #c00; }
  .cmsg.thinking{ align-self: flex-start; background: #f5f5f5; border: 1px dashed #ccc; color: #888; font-style: italic; }
  /* Markdown inside agent messages */
  .cmsg.agent h1,.cmsg.agent h2,.cmsg.agent h3 { margin: 10px 0 5px; font-weight: 700; }
  .cmsg.agent h1 { font-size: 1.15em; border-bottom: 1px solid #eee; padding-bottom: 3px; }
  .cmsg.agent h2 { font-size: 1.03em; }
  .cmsg.agent h3 { font-size: 0.95em; }
  .cmsg.agent p  { margin: 5px 0; }
  .cmsg.agent ul,.cmsg.agent ol { margin: 5px 0 5px 18px; }
  .cmsg.agent li { margin: 2px 0; }
  .cmsg.agent strong { font-weight: 700; }
  .cmsg.agent code { background: #f4f4f4; border: 1px solid #ddd; border-radius: 3px; padding: 1px 5px; font-family: monospace; font-size: 0.88em; }
  .cmsg.agent pre  { background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px; padding: 8px; overflow-x: auto; margin: 6px 0; }
  .cmsg.agent pre code { background: none; border: none; padding: 0; }
  .cmsg.agent table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.87em; }
  .cmsg.agent th { background: #003366; color: #fff; padding: 5px 9px; text-align: left; }
  .cmsg.agent td { border: 1px solid #ddd; padding: 4px 9px; }
  .cmsg.agent tr:nth-child(even) td { background: #f9f9f9; }
  .cmsg.agent blockquote { border-left: 3px solid #0070d2; margin: 6px 0; padding: 3px 10px; color: #555; background: #f5f8ff; }
  .chat-input-bar { background: #fff; border-top: 1px solid #ddd; padding: 10px 16px; display: flex; gap: 10px; flex-shrink: 0; }
  .chat-input-bar textarea { flex: 1; padding: 9px 12px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-size: 13px; font-family: inherit; height: 56px; }
  .chat-input-bar textarea:focus { outline: none; border-color: #0070d2; }
  .chat-input-bar button { padding: 0 18px; background: #003366; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .chat-input-bar button:disabled { background: #999; cursor: not-allowed; }

  /* ── CLICKABLE TILES ──────────────────────────────────────────────── */
  .kpi-card { cursor: pointer; transition: box-shadow .15s, transform .1s; }
  .kpi-card:hover { box-shadow: 0 4px 14px rgba(0,112,242,.18); transform: translateY(-2px); }
  .domain-card { cursor: pointer; transition: box-shadow .15s, transform .1s; }
  .domain-card:hover { box-shadow: 0 4px 14px rgba(0,112,242,.18); transform: translateY(-2px); }

  /* ── DOMAIN STATUS GRID ───────────────────────────────────────────── */
  .domain-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .domain-card {
    background: var(--surface); border: 1px solid #a0aab4; border-radius: 8px;
    padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  .domain-card .d-name { font-size: 13px; font-weight: 700; letter-spacing: .5px; margin-bottom: 6px; }
  .domain-card .d-count { font-size: 26px; font-weight: 700; }
  .domain-card .d-status { font-size: 11px; margin-top: 4px; }
  .domain-card.live   { border-left: 4px solid var(--sap-green); }
  .domain-card.live .d-count   { color: var(--sap-green); }
  .domain-card.stale  { border-left: 4px solid var(--sap-orange); }
  .domain-card.stale .d-count  { color: var(--sap-orange); }
  .domain-card.missing{ border-left: 4px solid var(--sap-red); }
  .domain-card.missing .d-count{ color: var(--sap-red); }

  /* ── LOADER ───────────────────────────────────────────────────────── */
  .spinner { text-align: center; padding: 40px; color: var(--text-light); font-size: 14px; }
  .spinner::before { content: '⟳ '; animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── TOAST ────────────────────────────────────────────────────────── */
  #toast {
    position: fixed; bottom: 28px; right: 28px; z-index: 500;
    background: #333; color: #fff; padding: 12px 20px; border-radius: 6px;
    font-size: 13px; max-width: 360px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    transition: opacity .3s; opacity: 0; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #toast.ok   { background: var(--sap-green); }
  #toast.err  { background: var(--sap-red); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">⚖ Mass Balance Reconciliation</div>
  <div class="sub">SAP IS-Oil &amp; Gas · Refinery Operations</div>
  <div class="user" id="hdr-user">Plant 1000</div>
</header>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="nav-section">Overview</div>
  <a class="nav-link active" data-screen="kpi" href="#kpi"><span class="ico">📊</span> KPI Dashboard</a>

</nav>

<!-- MAIN -->
<main id="main"></main>

<!-- TOAST -->
<div id="toast"></div>

<!-- APPROVE/REJECT MODAL -->
<div class="overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-box">
    <h3 id="modal-title">Approve Correction</h3>
    <div class="form-row">
      <label>Your Name</label>
      <input id="m-name" type="text" placeholder="e.g. Priya Sharma"/>
    </div>
    <div class="form-row">
      <label>Your Role</label>
      <input id="m-role" type="text" placeholder="e.g. Plant Manager"/>
    </div>
    <div class="form-row">
      <label id="m-comment-label">Comments</label>
      <textarea id="m-comments" placeholder="Optional comments…"></textarea>
    </div>

</div>

<!-- TRIGGER RUN MODAL -->
<div class="overlay hidden" id="run-modal-overlay">
  <div class="modal">
    <h3>Trigger Mass Balance Run</h3>
    <div class="form-row">
      <label>Plant</label>
      <select id="run-plant">
        <option value="1000">1000 — Main Refinery</option>
        <option value="2000">2000 — Satellite Plant</option>
      </select>
    </div>
    <div class="form-row">
      <label>Period</label>
      <input id="run-period" type="text" placeholder="YYYY-MM or YYYY-MM-DD" value="2026-10"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="document.getElementById('run-modal-overlay').classList.add('hidden')">Cancel</button>
      <button class="btn btn-primary" onclick="submitRun()">Run</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════════
const BASE = '/odata/v4/mass-balance';
const AGENT_BASE = '';  // CAP unbound action via same OData service

// ═══════════════════════════════════════════════════════════════════════
// ROUTING
// ═══════════════════════════════════════════════════════════════════════
let currentScreen = null;
let modalAction = null;
let modalExceptionId = null;

document.querySelectorAll('.nav-link').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    navigate(a.dataset.screen);
  });
});

function navigate(screen) {
  currentScreen = screen;
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.screen === screen));
  window.location.hash = screen;
  renderScreen(screen);
}

window.addEventListener('hashchange', () => {
  const s = location.hash.slice(1) || 'kpi';
  if (s !== currentScreen) navigate(s);
});

// ═══════════════════════════════════════════════════════════════════════
// OData FETCH HELPER
// ═══════════════════════════════════════════════════════════════════════
async function od(path) {
  const r = await fetch(BASE + path, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  const j = await r.json();
  return j.value !== undefined ? j.value : j;
}

async function odAction(entitySet, key, action, body) {
  const url = key
    ? BASE + '/' + entitySet + '(' + encodeURIComponent(key) + ')/' + action
    : BASE + '/' + action;
  const r = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const t = await r.text();
    throw new Error(t);
  }
  return r.json();
}

// ═══════════════════════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════════════════════
function toast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + type;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = ''; }, 3500);
}

// ═══════════════════════════════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════════════════════════════
function fmtPct(v) { return v != null ? (v * 100).toFixed(4) + ' %' : '—'; }
function fmtNum(v) { return v != null ? Number(v).toLocaleString() : '—'; }
function fmtTs(v)  { return v ? new Date(v).toLocaleString() : '—'; }
function fmtDate(v){ return v ? v.substring(0,10) : '—'; }

function severityBadge(s) {
  const map = { CRITICAL:'badge-red', WARNING:'badge-orange', ADVISORY:'badge-blue', INFO:'badge-grey' };
  return `<span class="badge ${map[s]||'badge-grey'}">${s||'—'}</span>`;
}
function statusBadge(s) {
  const map = { OPEN:'badge-blue', UNDER_REVIEW:'badge-orange', APPROVED:'badge-green', CLOSED:'badge-grey', COMPLETE:'badge-green', RUNNING:'badge-orange', FAILED:'badge-red' };
  return `<span class="badge ${map[s]||'badge-grey'}">${s||'—'}</span>`;
}
function decisionBadge(d) {
  return d === 'APPROVED' ? `<span class="badge badge-green">APPROVED</span>` : `<span class="badge badge-red">REJECTED</span>`;
}
function domainClass(s) { return (s||'').toLowerCase(); }

// ═══════════════════════════════════════════════════════════════════════
// RENDER ROUTER
// ═══════════════════════════════════════════════════════════════════════
function renderScreen(screen) {
  const m = document.getElementById('main');
  m.innerHTML = `<div class="spinner">Loading…</div>`;
  ({
    kpi:        renderKpi,
    domain:     renderDomain,
    exceptions: renderExceptions,
    approvals:  renderApprovals,
    tolerances: renderTolerances,
    audit:      renderAudit,
    chat:       renderChat,
  }[screen] || renderKpi)();
}

async function renderKpi() {
  try {

    const openExcs = excs.filter(e => e.status === 'OPEN' || e.status === 'UNDER_REVIEW');
    const criticals = excs.filter(e => e.severity === 'CRITICAL');

    const kpiHtml = `
    <div class="kpi-row">
      <div class="kpi-card ${Math.abs(parseFloat(latest.overallVariancePct))>0.001?'orange':'green'}" onclick="document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth'})" title="Click to see run history below">
        <div class="kpi-label">Latest Variance</div>
        <div class="kpi-value">${fmtPct(parseFloat(latest.overallVariancePct))}</div>
        <div class="kpi-delta">Plant ${latest.plant||'—'} · ${latest.period||'—'} · click for run history ↓</div>

        <div class="kpi-label">Open Exceptions</div>
        <div class="kpi-value">${openExcs.length}</div>
        <div class="kpi-delta">${criticals.length} critical · click to view ↗</div>
      </div>
      <div class="kpi-card" onclick="document.querySelector('.table-wrap').scrollIntoView({behavior:'smooth'})" title="Click to see completed runs below">
        <div class="kpi-label">Avg Variance (last ${complete.length} runs)</div>
        <div class="kpi-value">${(avgVar*100).toFixed(4)} %</div>
        <div class="kpi-delta">Absolute average · click for run history ↓</div>
      </div>
      <div class="kpi-card ${(parseFloat(latest.dataCompleteness)||0)<100?'orange':'green'}" onclick="navigate('domain')" title="Click to view domain status">
        <div class="kpi-label">Data Completeness</div>
        <div class="kpi-value">${latest.dataCompleteness != null ? Number(latest.dataCompleteness).toFixed(1)+'%' : '—'}</div>

    <tr>

      <td>${r.period||'—'}</td>
      <td>${statusBadge(r.status)}</td>

      <td>${fmtNum(r.tanksReconciled)}</td>
      <td>${fmtNum(r.exceptionCount)}</td>
      <td>${fmtNum(r.pendingApprovals)}</td>
      <td>${r.triggeredBy||'—'}</td>
      <td>${fmtTs(r.startedAt)}</td>
    </tr>`).join('');

    document.getElementById('main').innerHTML = `
    <div class="screen-title">KPI Dashboard</div>
    <div class="screen-sub">Reconciliation run history and key performance indicators</div>
    <div class="toolbar">
      <div class="spacer"></div>

let exceptionData = [];
function renderExceptionTable(filter) {
  let rows = exceptionData;
  if (filter.search) {
    const q = filter.search.toLowerCase();
    rows = rows.filter(r => (r.exceptionId+r.material+r.plant+r.rootCause+r.severity).toLowerCase().includes(q));
  }
  if (filter.severity && filter.severity !== 'ALL') rows = rows.filter(r => r.severity === filter.severity);
  if (filter.status && filter.status !== 'ALL') rows = rows.filter(r => r.status === filter.status);

  const tableRows = rows.map(r => `
  <tr>
    <td><strong>${r.exceptionId||'—'}</strong></td>
    <td>${r.period||'—'}</td>
    <td>${r.plant||'—'}</td>
    <td>${r.storageLocation||'—'}</td>
    <td>${r.material||'—'}</td>
    <td style="font-weight:600">${r.varianceMT != null ? Number(r.varianceMT).toFixed(3) : '—'} MT</td>
    <td>${fmtPct(parseFloat(r.variancePct))}</td>
    <td>${severityBadge(r.severity)}</td>
    <td style="font-size:11px">${r.rootCause||'—'}</td>
    <td>${statusBadge(r.status)}</td>
    <td>
      ${r.status !== 'APPROVED' && r.status !== 'CLOSED' ? `
        <button class="btn btn-success btn-sm" onclick="openApprove('${r.exceptionId}')">✓ Approve</button>
        <button class="btn btn-danger btn-sm" onclick="openReject('${r.exceptionId}')">✗ Reject</button>
      ` : ''}
    </td>
  </tr>`).join('');

  // Update only the subtitle and tbody — never touch the toolbar so inputs keep focus
  const sub = document.querySelector('#exc-screen-sub');
  if (sub) sub.textContent = `${rows.length} of ${exceptionData.length} exceptions shown`;
  const tbody = document.querySelector('#exc-tbody');
  if (tbody) tbody.innerHTML = tableRows || '<tr class="empty-row"><td colspan="11">No exceptions found</td></tr>';
}

// AI ASSISTANT — full chat UI matching standalone agent look & feel
// ═══════════════════════════════════════════════════════════════════════
let chatHistory = [];
let chatContextId = 'ctx-' + Math.random().toString(36).slice(2, 10);

if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });

function renderChat() {
  const samples = [
    'Run daily mass balance for plant 1000 for today',
    'Show all CRITICAL exceptions for this month',
    'What is the closing stock for CRUDE01 in plant 1000?',
    'List all pending approval corrections',
    'Explain the variance classification rules',
    'Summarise the latest reconciliation run',
  ];

  document.getElementById('main').innerHTML = `
  <div class="chat-outer">
    <div class="chat-hdr">
      <h2>&#9878;&#65039; Mass Balance Reconciliation Agent</h2>
      <span class="badge">OGS/IS-Oil AI</span>
    </div>
    <div class="chat-samples">
      <label>Try:</label>
      ${samples.map(s => `<button class="chat-sample-btn" onclick="chatAsk(${JSON.stringify(s)})">${s}</button>`).join('')}
      <button class="chat-clear-btn" onclick="clearChat()">&#128465; Clear</button>
    </div>
    <div class="chat-msgs" id="chat-msgs">
      <div class="cmsg agent">Hello! I am the <strong>Mass Balance Reconciliation Agent</strong>.<br><br>
I automate the hydrocarbon mass balance reconciliation cycle — pulling live data from SAP IS-Oil &amp; Gas (OGS_S4), validating, calculating variances, and raising exceptions for your approval.<br><br>
Click a sample question above or type your own below.</div>
    </div>
    <div class="chat-input-bar">
      <textarea id="chat-input" placeholder="Ask the agent to run mass balance, show exceptions, approve corrections…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button id="chat-send-btn" onclick="sendChat()">Send</button>
    </div>
  </div>`;

  // Restore history
  if (chatHistory.length) {
    const box = document.getElementById('chat-msgs');
    chatHistory.forEach(m => {
      const d = document.createElement('div');
      d.className = 'cmsg ' + m.role;
      if (m.role === 'agent') {
        d.innerHTML = typeof DOMPurify !== 'undefined' && typeof marked !== 'undefined'
          ? DOMPurify.sanitize(marked.parse(m.text))
          : m.text;
      } else {
        d.textContent = m.text;
      }
      box.appendChild(d);
    });
    box.scrollTop = box.scrollHeight;
  }
}

function chatAsk(text) {
  const inp = document.getElementById('chat-input');
  if (inp) { inp.value = text; sendChat(); }
}

async function sendChat() {
  const inp = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  if (!inp) return;
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  if (btn) btn.disabled = true;

  const box = document.getElementById('chat-msgs');

  const userDiv = document.createElement('div');
  userDiv.className = 'cmsg user';
  userDiv.textContent = msg;
  box.appendChild(userDiv);
  chatHistory.push({ role: 'user', text: msg });

  const thinkDiv = document.createElement('div');
  thinkDiv.className = 'cmsg thinking';
  thinkDiv.textContent = '⏳ Processing…';
  box.appendChild(thinkDiv);
  box.scrollTop = box.scrollHeight;

  try {
    const result = await odAction(null, null, 'sendAgentMessage', { message: msg, contextId: chatContextId });
    thinkDiv.remove();
    const replyText = typeof result === 'string' ? result : (result.value || JSON.stringify(result));
    const agentDiv = document.createElement('div');
    agentDiv.className = 'cmsg agent';
    agentDiv.innerHTML = typeof DOMPurify !== 'undefined' && typeof marked !== 'undefined'
      ? DOMPurify.sanitize(marked.parse(replyText))
      : replyText;
    box.appendChild(agentDiv);
    chatHistory.push({ role: 'agent', text: replyText });
  } catch(e) {
    thinkDiv.className = 'cmsg error';
    thinkDiv.textContent = '❌ Error: ' + e.message;
    chatHistory.push({ role: 'agent', text: 'Error: ' + e.message });
  }
  box.scrollTop = box.scrollHeight;
  if (btn) btn.disabled = false;
  if (inp) inp.focus();
}

function clearChat() {
  chatHistory = [];
  chatContextId = 'ctx-' + Math.random().toString(36).slice(2, 10);
  renderChat();
}

// ═══════════════════════════════════════════════════════════════════════
// APPROVAL MODAL
// ═══════════════════════════════════════════════════════════════════════
function openApprove(exceptionId) {
  modalAction = 'approve'; modalExceptionId = exceptionId;
  document.getElementById('modal-title').textContent = 'Approve Exception ' + exceptionId;
  document.getElementById('m-comment-label').textContent = 'Comments';
  document.getElementById('m-confirm').className = 'btn btn-success';
  document.getElementById('m-confirm').textContent = '✓ Approve';
  document.getElementById('m-name').value = '';
  document.getElementById('m-role').value = '';
  document.getElementById('m-comments').value = '';
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function openReject(exceptionId) {
  modalAction = 'reject'; modalExceptionId = exceptionId;
  document.getElementById('modal-title').textContent = 'Reject Exception ' + exceptionId;
  document.getElementById('m-comment-label').textContent = 'Reason for Rejection';
  document.getElementById('m-confirm').className = 'btn btn-danger';
  document.getElementById('m-confirm').textContent = '✗ Reject';
  document.getElementById('m-name').value = '';
  document.getElementById('m-role').value = '';
  document.getElementById('m-comments').value = '';
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}

async function submitModal() {
  const name = document.getElementById('m-name').value.trim();
  const role = document.getElementById('m-role').value.trim();
  const comments = document.getElementById('m-comments').value.trim();
  if (!name || !role) { toast('Please enter your name and role', 'err'); return; }

  closeModal();
  try {
    if (modalAction === 'approve') {
      await odAction('Exceptions', modalExceptionId, 'approveCorrection', { approverName: name, approverRole: role, comments });
      toast('Exception ' + modalExceptionId + ' approved', 'ok');
    } else {
      await odAction('Exceptions', modalExceptionId, 'rejectCorrection', { approverName: name, approverRole: role, reason: comments });
      toast('Exception ' + modalExceptionId + ' rejected', 'ok');
    }
    if (currentScreen === 'exceptions') renderExceptions();
    if (currentScreen === 'approvals') renderApprovals();
  } catch(e) {
    toast('Action failed: ' + e.message, 'err');
  }
}

// TRIGGER RUN
// ═══════════════════════════════════════════════════════════════════════
async function submitRun() {
  const plant  = document.getElementById('run-plant').value;
  const period = document.getElementById('run-period').value.trim();
  if (!period) { toast('Enter a period (YYYY-MM or YYYY-MM-DD)', 'err'); return; }
  document.getElementById('run-modal-overlay').classList.add('hidden');
  toast('Triggering run for plant ' + plant + ' period ' + period + '…');
  try {
    // Create a run record then call the action
    const result = await odAction('ReconciliationRuns', null, 'triggerReconciliation', { plant, period, contextId: 'run-' + Date.now() });
    toast('Run triggered — ' + (typeof result === 'string' ? result.substring(0,80) : 'started'), 'ok');
    setTimeout(() => renderKpi(), 1500);
  } catch(e) {
    toast('Failed to trigger run: ' + e.message, 'err');
  }
}
