[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:orchestrator]
command=python orchestrator/app/main.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="8080",PYTHONPATH="/app/orchestrator",LOG_LEVEL="INFO"

[program:cap-app]
command=/bin/sh /cap/start-cap.sh
directory=/cap
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=MASS_BALANCE_AGENT_URL="http://localhost:8080"
